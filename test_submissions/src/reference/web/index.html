<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reference player (self-test, frame cycler)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #player {
    display: block;
    width: 1280px;
    height: 720px;
    object-fit: contain;
  }
</style>
</head>
<body>
<img id="player" data-testid="player-video" alt="">
<script>
(() => {
  // Self-test fixture: cycle through the per-profile reference PNG sequence
  // at the profile's native 25 fps. A real contestant would decode an HEVC
  // RTSP stream here; this stub feeds the evaluator the exact frames it
  // would have produced from a perfect decode, so the capture/analyze/score
  // pipeline can be exercised end-to-end on hosts where Chrome can't HEVC-
  // decode via <video>.
  const params = new URLSearchParams(window.location.search);
  const profile = params.get('profile') === '4k' ? '4k' : '2k';

  // Match the watermark generator: 20 fps × 30 s duration = 600 frames.
  const TOTAL = 600;
  const FPS = 20;
  const pad = (n) => String(n).padStart(5, '0');

  const player = document.getElementById('player');
  let i = 0;
  player.src = `/${profile}/frame_${pad(0)}.png`;
  player.addEventListener('load', () => { window.__PLAYER_READY__ = true; }, { once: true });
  player.addEventListener('error', () => {
    window.__PLAYER_ERROR__ = 'reference frame load failed';
  });

  setInterval(() => {
    i = (i + 1) % TOTAL;
    player.src = `/${profile}/frame_${pad(i)}.png`;
  }, 1000 / FPS);
})();
</script>
</body>
</html>
