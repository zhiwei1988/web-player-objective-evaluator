<!doctype html>
<html><head><meta charset="utf-8"><title>static frame cheat</title>
<style>html,body{margin:0;background:#000}#p{display:block;width:1280px;height:720px;object-fit:contain}</style>
</head>
<body>
<img id="p" data-testid="player-video" alt="">
<script>
const profile = new URLSearchParams(location.search).get('profile') === '4k' ? '4k' : '2k';
const p = document.getElementById('p');
p.onload = () => { window.__PLAYER_READY__ = true; };
p.onerror = () => { window.__PLAYER_ERROR__ = 'static img load failed'; };
p.src = `/${profile}.png`;
</script>
</body></html>
