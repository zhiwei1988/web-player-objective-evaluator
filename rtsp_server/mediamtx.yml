# MediaMTX configuration for the objective evaluator.
# Listens on :8554 only; forces RTSP-over-TCP for both client and contestant traffic.
# The two paths use ffmpeg's on-demand publish mode: when a reader connects,
# MediaMTX spawns ffmpeg to loop the pre-encoded MP4 with -c:v copy (no re-encode).
#
# IMPORTANT: MediaMTX does NOT expand env vars or templates in YAML string values.
# The `-i streams/...` path is RELATIVE; scripts/start_rtsp.sh `cd`s into the repo
# root before launching MediaMTX so that ffmpeg's inherited cwd resolves it.

logLevel: warn
logDestinations: [stdout]

# Disable everything except RTSP-TCP.
rtsp: yes
protocols: [tcp]
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

paths:
  test/h264:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel warning
      -re -stream_loop -1
      -i streams/h264_watermarked.mp4
      -c:v copy -an -f rtsp
      -rtsp_transport tcp
      rtsp://127.0.0.1:8554/test/h264
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s

  test/h265:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel warning
      -re -stream_loop -1
      -i streams/h265_watermarked.mp4
      -c:v copy -an -f rtsp
      -rtsp_transport tcp
      rtsp://127.0.0.1:8554/test/h265
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
